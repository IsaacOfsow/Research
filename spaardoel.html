<title>Spaardoel 29 januari</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: één smalle kolom voor een telefoon. Bovenaan voortgang, dan wat je moet storten, dan storten, dan weekplan. */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --fg: #16201b;
  --muted: #5e6b64;
  --line: #dde3dd;
  --accent: #0f6b4f;
  --accent-fg: #ffffff;
  --track: #dbe6df;
  --good: #14803c;
  --warn: #b4540a;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "Figtree", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1713; --surface: #18231d; --fg: #e8efe9; --muted: #93a39a; --line: #263329;
    --accent: #4cc596; --accent-fg: #07130d; --track: #263329; --good: #4cc27a; --warn: #f0a15a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1713; --surface: #18231d; --fg: #e8efe9; --muted: #93a39a; --line: #263329;
  --accent: #4cc596; --accent-fg: #07130d; --track: #263329; --good: #4cc27a; --warn: #f0a15a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, .big { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }

.hero { display: flex; flex-direction: column; gap: 12px; }
.big { font-size: clamp(44px, 14vw, 64px); font-weight: 800; line-height: 1; }
.of { color: var(--muted); font-size: 16px; }
.bar { position: relative; height: 16px; border-radius: 8px; background: var(--track); margin-top: 8px; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: var(--accent); transition: width .4s; }
.plan { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--fg); border-radius: 2px; transform: translateX(-1px); }
.legend { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.pill { align-self: flex-start; padding: 6px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; border: 1.5px solid currentColor; }
.pill.good { color: var(--good); } .pill.warn { color: var(--warn); }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.card .v { font-family: var(--font-display); font-weight: 800; font-size: 24px; margin-top: 2px; }
.card .eyebrow { display: block; }

section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
h2 { font-size: 20px; font-weight: 600; }
form { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; flex: 1 1 140px; min-width: 0; }
input { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; width: 100%; min-width: 0; }
input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; border: 0; padding: 14px 16px; background: var(--accent); color: var(--accent-fg); }
button.ghost { background: transparent; color: var(--muted); padding: 6px 10px; border: 1px solid var(--line); font-size: 13px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.quick button { background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 10px 14px; }

ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
li .meta { min-width: 0; display: flex; flex-direction: column; }
li .meta small { color: var(--muted); overflow-wrap: anywhere; }
.weeks li.now { font-weight: 600; color: var(--accent); }
.weeks li.done { color: var(--muted); }
.empty { color: var(--muted); font-size: 15px; }
</style>

<main>
  <header>
    <div class="eyebrow">Spaardoel</div>
    <h1 style="font-size:22px;font-weight:600">€ 7.000 voor 29 januari 2027</h1>
  </header>

  <div class="hero">
    <div class="num"><span class="big" id="saved">€ 0</span></div>
    <div class="of num" id="ofline"></div>
    <div class="bar" role="progressbar" id="bar" aria-valuemin="0" aria-valuemax="7000">
      <div class="fill" id="fill"></div>
      <div class="plan" id="plan" title="Waar je vandaag volgens plan moet zijn"></div>
    </div>
    <div class="legend"><span>Verticale streep: waar je vandaag zou moeten staan</span></div>
    <div class="pill good" id="status"></div>
  </div>

  <div class="grid">
    <div class="card"><span class="eyebrow">Nog te sparen</span><div class="v num" id="left"></div></div>
    <div class="card"><span class="eyebrow">Dagen over</span><div class="v num" id="days"></div></div>
    <div class="card"><span class="eyebrow">Per week</span><div class="v num" id="perweek"></div></div>
    <div class="card"><span class="eyebrow">Per maand</span><div class="v num" id="permonth"></div></div>
  </div>

  <section>
    <h2>Geld erbij</h2>
    <form id="form">
      <div class="row">
        <label for="amount">Bedrag (€)<input id="amount" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="bijv. 150" required></label>
        <label for="note">Notitie (optioneel)<input id="note" type="text" maxlength="60" placeholder="bijv. salaris"></label>
      </div>
      <div class="quick" id="quick"></div>
      <button type="submit">Opslaan</button>
    </form>
  </section>

  <section>
    <h2>Startbedrag</h2>
    <label for="start">Wat had je al op 5 november? (€)
      <input id="start" type="number" inputmode="decimal" step="0.01" min="0" value="0">
    </label>
    <div class="empty">Dit telt mee in het totaal en in je schema.</div>
  </section>

  <section>
    <h2>Je stortingen</h2>
    <ul id="list"></ul>
  </section>

  <section>
    <h2>Schema per week</h2>
    <div class="empty">Zo ver moet je zijn aan het einde van elke week.</div>
    <ul class="weeks" id="weeks"></ul>
  </section>
</main>

<script>
(function () {
  var GOAL = 7000;
  function d(y, m, day) { return new Date(y, m - 1, day); }
  var START = d(2026, 11, 5), END = d(2027, 1, 29), DAY = 86400000;
  var fmt = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  var fmt2 = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
  var dfmt = new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "short" });
  var KEY = "spaardoel-v1";
  var state = { start: 0, items: [] };
  try { var raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch (e) {}
  if (!state || !Array.isArray(state.items)) state = { start: 0, items: [] };
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function $(id) { return document.getElementById(id); }
  function days(a, b) { return Math.round((b - a) / DAY); }
  function total() { return (Number(state.start) || 0) + state.items.reduce(function (s, i) { return s + i.amount; }, 0); }
  function planAt(date) {
    var t = Math.min(1, Math.max(0, days(START, date) / days(START, END)));
    var s = Number(state.start) || 0;
    return s + (GOAL - s) * t;
  }

  function render() {
    var saved = total(), t = today();
    var left = Math.max(0, GOAL - saved);
    var daysLeft = Math.max(0, days(t, END));
    var pct = Math.min(100, saved / GOAL * 100);
    var plan = planAt(t);

    $("saved").textContent = fmt.format(saved);
    $("ofline").textContent = "van " + fmt.format(GOAL) + " (" + Math.round(pct) + "%)";
    $("fill").style.width = pct + "%";
    $("plan").style.left = Math.min(100, plan / GOAL * 100) + "%";
    $("bar").setAttribute("aria-valuenow", Math.round(saved));

    var st = $("status"), diff = saved - plan;
    if (saved >= GOAL) { st.textContent = "Doel bereikt!"; st.className = "pill good"; }
    else if (t < START) { st.textContent = "Het schema start op 5 november"; st.className = "pill good"; }
    else if (diff >= 0) { st.textContent = "Voor op schema: " + fmt.format(diff) + " voor"; st.className = "pill good"; }
    else { st.textContent = "Achter op schema: " + fmt.format(-diff) + " te weinig"; st.className = "pill warn"; }

    $("left").textContent = fmt.format(left);
    $("days").textContent = daysLeft;
    $("perweek").textContent = daysLeft > 0 ? fmt.format(left / (daysLeft / 7)) : fmt.format(left);
    $("permonth").textContent = daysLeft > 0 ? fmt.format(left / (daysLeft / 30.44)) : fmt.format(left);

    var list = $("list"); list.innerHTML = "";
    if (!state.items.length) {
      var e = document.createElement("li"); e.className = "empty"; e.textContent = "Nog geen stortingen. Voeg je eerste bedrag toe hierboven."; list.appendChild(e);
    }
    state.items.slice().reverse().forEach(function (it) {
      var li = document.createElement("li");
      var meta = document.createElement("div"); meta.className = "meta";
      var a = document.createElement("span"); a.className = "num"; a.textContent = "+ " + fmt2.format(it.amount);
      var sm = document.createElement("small"); sm.textContent = dfmt.format(new Date(it.date)) + (it.note ? " · " + it.note : "");
      meta.appendChild(a); meta.appendChild(sm);
      var b = document.createElement("button"); b.type = "button"; b.className = "ghost"; b.textContent = "Verwijder";
      b.setAttribute("aria-label", "Verwijder storting van " + fmt2.format(it.amount));
      b.onclick = function () { state.items = state.items.filter(function (x) { return x.id !== it.id; }); save(); render(); };
      li.appendChild(meta); li.appendChild(b); list.appendChild(li);
    });

    var wk = $("weeks"); wk.innerHTML = "";
    var n = Math.ceil(days(START, END) / 7);
    for (var i = 1; i <= n; i++) {
      var end = new Date(START.getTime() + Math.min(days(START, END), i * 7) * DAY);
      var target = planAt(end);
      var li2 = document.createElement("li");
      var done = saved >= target || end < t;
      var isNow = !done || (end >= t && new Date(end.getTime() - 7 * DAY) < t);
      if (end < t) li2.className = "done"; else if (end >= t && new Date(end.getTime() - 7 * DAY) <= t) li2.className = "now";
      var l = document.createElement("span"); l.textContent = "Week " + i + " · t/m " + dfmt.format(end);
      var r = document.createElement("span"); r.className = "num"; r.textContent = fmt.format(Math.round(target));
      li2.appendChild(l); li2.appendChild(r); wk.appendChild(li2);
    }
  }

  var quick = $("quick");
  [50, 100, 250, 500].forEach(function (v) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = "€ " + v;
    b.onclick = function () { $("amount").value = v; $("amount").focus(); };
    quick.appendChild(b);
  });

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var amt = parseFloat(String($("amount").value).replace(",", "."));
    if (!(amt > 0)) return;
    state.items.push({ id: Date.now(), amount: Math.round(amt * 100) / 100, note: $("note").value.trim(), date: new Date().toISOString() });
    $("amount").value = ""; $("note").value = "";
    save(); render();
  });
  $("start").value = state.start || 0;
  $("start").addEventListener("input", function () {
    state.start = Math.max(0, parseFloat(String(this.value).replace(",", ".")) || 0);
    save(); render();
  });
  render();
})();
</script>
